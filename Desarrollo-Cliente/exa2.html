<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de formulario</title>
</head>
<body>

    <h2>Formulario</h2>

    <form id="formulario">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">
        <br><br>

        <label for="email">Email:</label>
        <input type="text" id="email">
        <br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad">
        <br><br>

        <button type="submit">Enviar</button>
    </form>

    <div id="mensaje"></div>

    <script>
        // Seleccionamos el formulario y el div de mensajes
        const formulario = document.getElementById("formulario");
        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", function(event) {

            // Evita que el formulario se envíe y recargue la página
            event.preventDefault();

            // Obtenemos los valores de los campos
            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("email").value.trim();
            const edad = document.getElementById("edad").value.trim();

            // Comprobamos si algún campo está vacío
            if (nombre === "" || email === "" || edad === "") {
                mensaje.textContent = "Error: ningún campo puede estar vacío.";
                mensaje.style.color = "red";
                return;
            }

            // Comprobamos que el email contenga "@"
            if (!email.includes("@")) {
                mensaje.textContent = "Error: el email debe contener @.";
                mensaje.style.color = "red";
                return;
            }

            // Convertimos la edad a número
            const edadNumero = Number(edad);

            // Comprobamos que la edad sea mayor que 17
            if (edadNumero <= 17 || isNaN(edadNumero)) {
                mensaje.textContent = "Error: la edad debe ser un número mayor que 17.";
                mensaje.style.color = "red";
                return;
            }

            // Si todas las validaciones son correctas
            mensaje.textContent = "Formulario enviado correctamente.";
            mensaje.style.color = "green";
        });
    </script>

</body>
</html>
