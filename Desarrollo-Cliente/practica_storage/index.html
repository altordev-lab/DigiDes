<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica: Almacenamiento local</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Práctica guiada: Almacenamiento local</h1>
    <section class="card">
        <h2>Preferencias del usuario</h2>
        <label>Nombre: <input id="nombre" placeholder="Tu nombre"></label>
        <label>Tema:
            <select id="tema">
                <option value="claro">Claro</option>
                <option value="oscuro">Oscuro</option>
            </select>
        </label>
        <div class="row">
            <button id="guardar">Guardar en localStorage</button>
            <button id="leer">Leer del almacenamiento</button>
            <button id="borrar">Borrar datos</button>
        </div>
    </section>
    <section class="card">
        <h2>Estado actual</h2>
        <pre id="estado"></pre>
    </section>
    <script src="script.js"></script>
</body>
</html>
