<html>
<body>

    <button id="btn_bio">Biografía</button>
    <button id="btn_sal">Saluda</button>

    <h2 id="text_bio"></h2>
    <h2 di="text_sal"></h2>

    <script>

        var biografia = document.getElementById("btn_bio"); 
        var saluda = document.getElementBy("btn_sal");

        var persona = {
            name: [ 'Rafa','Nadal'],
            age: 30,
            gender: 'masculino',
            interests: ['tenis', 'futbol'],
            bio: function() {
                alert(this.name[0] + '' + this.name[1] + ' tiene ' + this.age + ' años y le gusta el ' + this. interests[0] + ' y el ' + this.interests [1] + '.');
            } ,
            saluda: function () {
                alert('Hola, me llamo ' + this.name[0] + '.');
            }
        };

        biografia.addEventListener('click', () => {
            var biografia_text = document.getElementById("text_bio");
            biografia_text.innerHTML = persona.bio
        })

        saluda.addEventListener('click', () => {
            var saluda_text = document.getElementById("text_sal");
            saluda_text.innerHTML = persona.saluda
        })

    </script>
</body>
</html>
