<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ejercicio Formulario</title>
</head>
<body>
    <h1>Hotel Feedback Form</h1>
    <p>Thank you for staying with us. Please provide feedback on your recent stay.</p>

    <form>

        <fieldset>
            <legend>Personal Information</legend>

            <label for="nombre"> Name (required):</label> 
            <input type="text" id="nombre" required minlegth="4" placeholder="e.g., John Doe" />

            <label for="correo"> Email address (required):</label> 
            <input type="email" id="correo" required placeholder="example@email.com" />

            <label for="edad"> Age (optional):</label> 
            <input type="number" id="edad" width="4"/>

        </fieldset>
        <fieldset>
            <legend>Was this your first time at our hotel?</legend>

            <label> <input type="radio" value="si" name="primera" />Yes </label>
            <label> <input type="radio" value="no" name="primera" />No </label> 

        </fieldset>
        <fieldset>
            <legend>Why did you choose to stay at our hotel? (Check all that apply)</legend>

            <label> <input type="checkbox" value="1" name="porque" />Social Media Ads </label>
            <label> <input type="checkbox" value="2" name="porque" />Personal Recommendation </label>
            <label> <input type="checkbox" value="3" name="porque" />Location </label>
            <label> <input type="checkbox" value="4" name="porque" />Reputation </label>
            <label> <input type="checkbox" value="5" name="porque" />Price </label>
        
        </fieldset>
        <fieldset>
            <legend>Ratings</legend> 
            
            <label for="opciones">How was the service?</label>
            <select id="opciones" name="opciones">
                <option value="valor1">Excellent</option>
                <option value="valor2">Good</option>
                <option value="valor3">Bad</option>
            </select>
            </label>

            <label for="opciones2">How was the food?</label>
            <select id="opciones2" name="opciones2">
                <option value="valor4">Excellent</option>
                <option value="valor5">Good</option>
                <option value="valor6">Bad</option>
            </select>
            </label>
        </fieldset>
       
        <label> Other Comments?<textarea rows="10" cols="25"></textarea></label>

        <button type="submit">Submit</button>

    </form>
</body>
</html>
