<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Examen - Pregunta 4</title>
</head>
<body>
    <h2>Mini gestor de tareas</h2>

    <input type="text" id="entrada" placeholder="Escribe aquí">
    <button id="btn">Añadir tarea</button>

    <ul id="lista"></ul>
    
    <script>
        var elemento = document.getElementById("entrada").value.trim();
        var tareas = document.getElementById("lista");
        var boton = document.getElementById("btn");

        boton.addEventListener("click", () => {
            tareas.innerHTML = `<li>${elemento}</li>`;
        });

    </script>
</body>
