<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de formulario</title>
</head>
<body>
    <h2>Formulario</h2>

    <form id="formulario">
        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre"></input> <br><br>

        <label for="correo">Correo: </label>
        <input type="text" id="correo"></input> <br><br>

        <label for="edad">Edad: </label>
        <input type="number" id="edad"></input> <br><br>

        <button type="submit">Enviar</button>
    </form>
    <div id="mensaje"></div>
    <script>
        const formula = document.getElementById('formulario');
        const mensaje = document.getElementById('mensaje');

        formula.addEventListener('submit', function(event) {

            event.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const edad = document.getElementById('edad').value.trim();

            if (nombre === "" || correo === "" || edad === "") {
                mensaje.textContent = "Error: ningún campo puede estar vacío.";
                mensaje.style.color = "red";
                return;
            }

            if (!correo.includes('@')) {
                mensaje.textContent = "Error: el email debe contener un @.";
                mensaje.style.color = "red";
                return;
            }

            const numEdad = Number(edad);

            if (numEdad <= 17 || isNaN(numEdad)) {
                mensaje.textContent = "Error: la edad debe ser mayor que 17.";
                mensaje.style.color = "red";
                return;
            }

            mensaje.textContent = "Formulario enviado correctamente";
            mensaje.style.color = "lightgreen";
        });

    </script>
</body>
